/* ─── Ambient background glows ─── */
.bg-glow{position:fixed;inset:0;z-index:-2;pointer-events:none;overflow:hidden}
.bg-glow::before,.bg-glow::after{content:'';position:absolute;width:55vw;height:55vw;max-width:680px;max-height:680px;border-radius:50%;filter:blur(90px);opacity:.5}

/* Grain texture */
.bg-grain{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.04;

@keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(6%,8%)}}

.portrait-frame::after{content:"";position:absolute;inset:0;border-radius:50%;animation:glow 5s ease-in-out infinite;pointer-events:none;z-index:0}
.portrait{position:absolute;top:3px;left:3px;width:calc(100% - 6px);height:calc(100% - 6px);object-fit:cover;border-radius:50%;display:block;filter:grayscale(12%);border:0;margin:0}
